<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flight Plan · Camera</title>
<link rel="icon" href="data:,">
<style>
  :root { --red: #C3142D; --ink: #1b1b1b; --muted: #585E60; --line: #e5e7eb; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: #fff; }
  main { max-width: 480px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 22px; margin: 0 0 4px; } h1 b { color: var(--red); }
  p.sub { color: var(--muted); margin: 0 0 18px; font-size: 14px; }
  .row { display: flex; gap: 8px; margin: 10px 0; flex-wrap: wrap; }
  .chip { flex: 1; padding: 12px; border: 2px solid var(--line); border-radius: 10px; background: #fff; font-size: 16px; font-weight: 600; }
  .chip.on { border-color: var(--red); color: var(--red); background: #fff5f6; }
  input[type=password] { width: 100%; font-size: 18px; padding: 12px; border: 2px solid var(--line); border-radius: 10px; }
  button.big { width: 100%; padding: 22px; margin-top: 16px; font-size: 22px; font-weight: 800; color: #fff; background: var(--red); border: 0; border-radius: 14px; }
  button.big:disabled { opacity: .5; }
  .msg { margin-top: 16px; font-size: 18px; text-align: center; min-height: 26px; }
  .msg.ok { color: #166534; font-weight: 700; } .msg.err { color: var(--red); font-weight: 700; }
  img.prev { width: 100%; margin-top: 14px; border-radius: 10px; border: 1px solid var(--line); }
  label.k { font-size: 13px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  #file { display: none; }
</style>
</head>
<body>
<main>
  <h1>Flight Plan <b>camera</b></h1>
  <p class="sub">Photograph the whiteboard straight on, with the whole X and every mark in the frame.</p>
  <div id="keyBox">
    <label class="k" for="key">Admin key</label>
    <input id="key" type="password" autocomplete="off">
    <button class="big" id="saveKey">Continue</button>
  </div>
  <div id="camBox" hidden>
    <label class="k">Section</label>
    <div class="row" id="sections"></div>
    <label class="k">Which photo?</label>
    <div class="row" id="kinds"></div>
    <button class="big" id="shoot">Take photo</button>
    <input id="file" type="file" accept="image/*" capture="environment">
    <div class="msg" id="msg"></div>
    <img class="prev" id="prev" alt="" hidden>
  </div>
</main>
<script>
(function () {
  var qs = new URLSearchParams(location.search);
  var section = (qs.get("section") || "A").toUpperCase();
  var kind = "teams";
  var KEYK = "fp_admin_key";
  function key() { try { return sessionStorage.getItem(KEYK) || ""; } catch (e) { return ""; } }
  function $(id) { return document.getElementById(id); }
  function chips(box, items, cur, set) {
    box.textContent = "";
    items.forEach(function (it) {
      var b = document.createElement("button");
      b.className = "chip" + (it[0] === cur ? " on" : "");
      b.textContent = it[1];
      b.onclick = function () { set(it[0]); };
      box.appendChild(b);
    });
  }
  function draw() {
    chips($("sections"), [["A", "A · 8:30"], ["B", "B · 10:05"], ["Z", "Z · test"]], section, function (v) { section = v; draw(); });
    chips($("kinds"), [["teams", "First photo"], ["instructor", "Second photo"]], kind, function (v) { kind = v; draw(); });
  }
  function showCam() { $("keyBox").hidden = true; $("camBox").hidden = false; draw(); }
  $("saveKey").onclick = function () {
    try { sessionStorage.setItem(KEYK, $("key").value.trim()); } catch (e) {}
    showCam();
  };
  // Preselect the photo from the game's phase (the second photo is taken during the extra phase).
  fetch("/api/state?section=" + section).then(function (r) { return r.json(); }).then(function (j) { if (j && j.phase === "instructor") { kind = "instructor"; draw(); } }).catch(function () {});
  if (key()) showCam();
  $("shoot").onclick = function () { $("file").value = ""; $("file").click(); };
  function say(t, cls) { var m = $("msg"); m.textContent = t; m.className = "msg " + (cls || ""); }
  // Shrink to 1600 px on the long edge (JPEG 0.85) so the upload stays under the server's 1.6 MB cap.
  function shrink(file, cb) {
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function () {
      var long = Math.max(img.naturalWidth, img.naturalHeight), k = Math.min(1, 1600 / long);
      var w = Math.round(img.naturalWidth * k), h = Math.round(img.naturalHeight * k);
      var c = document.createElement("canvas"); c.width = w; c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      var q = 0.85, data = c.toDataURL("image/jpeg", q);
      while (data.length > 1500000 && q > 0.4) { q -= 0.1; data = c.toDataURL("image/jpeg", q); }
      cb(null, data, w, h);
    };
    img.onerror = function () { cb(new Error("Could not read that photo.")); };
    img.src = url;
  }
  $("file").onchange = function () {
    var f = this.files && this.files[0];
    if (!f) return;
    $("shoot").disabled = true; say("Sending…");
    shrink(f, function (err, dataUrl, w, h) {
      if (err) { $("shoot").disabled = false; return say(err.message, "err"); }
      $("prev").src = dataUrl; $("prev").hidden = false;
      fetch("/api/photo", { method: "POST", headers: { "Content-Type": "application/json", "x-admin-key": key() },
        body: JSON.stringify({ section: section, kind: kind, dataUrl: dataUrl, w: w, h: h }) })
        .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, status: r.status, j: j }; }); })
        .then(function (r) {
          $("shoot").disabled = false;
          if (r.ok) return say("Sent. Look at the projector.", "ok");
          if (r.status === 403) { try { sessionStorage.removeItem(KEYK); } catch (e) {} $("keyBox").hidden = false; $("camBox").hidden = true; }
          say((r.j && r.j.error) || "The upload failed. Try again.", "err");
        })
        .catch(function () { $("shoot").disabled = false; say("No connection. Try again.", "err"); });
    });
  };
})();
</script>
</body>
</html>
